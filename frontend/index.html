<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业轮动仪表盘</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  line-height: 1.6;
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 16px;
}

h1 {
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 20px;
  text-align: center;
  color: #ffffff;
  letter-spacing: 1px;
}

/* ── Status Bar ── */
.status-bar {
  background: #16213e;
  border-radius: 10px;
  padding: 16px 24px;
  margin-bottom: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 16px 32px;
  align-items: center;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.95rem;
}

.status-label {
  color: #8899aa;
}

.status-value {
  font-weight: 600;
}

.regime-bull { color: #00d4aa; }
.regime-bear { color: #ff6b6b; }
.regime-reduce { color: #ffa726; }

.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.82rem;
  font-weight: 600;
}

.badge-green {
  background: rgba(0, 212, 170, 0.15);
  color: #00d4aa;
  border: 1px solid rgba(0, 212, 170, 0.3);
}

.badge-red {
  background: rgba(255, 107, 107, 0.15);
  color: #ff6b6b;
  border: 1px solid rgba(255, 107, 107, 0.3);
}

.badge-orange {
  background: rgba(255, 167, 38, 0.15);
  color: #ffa726;
  border: 1px solid rgba(255, 167, 38, 0.3);
}

/* ── Table ── */
.panel {
  background: #16213e;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 20px;
  overflow-x: auto;
}

.panel-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 14px;
  color: #ffffff;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

thead th {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 2px solid #2a3a5e;
  color: #8899aa;
  font-weight: 600;
  white-space: nowrap;
}

tbody td {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  white-space: nowrap;
}

tbody tr:hover {
  background: rgba(255,255,255,0.03);
}

tbody tr.row-selected {
  border-left: 3px solid #00d4aa;
  background: rgba(0, 212, 170, 0.05);
}

tbody tr.row-stopped {
  color: #556677;
}

.score-pos { color: #00d4aa; }
.score-neg { color: #ff6b6b; }

/* ── Cards ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

.action-card {
  background: #1a1a2e;
  border: 1px solid #2a3a5e;
  border-radius: 10px;
  padding: 18px;
  transition: border-color 0.2s;
}

.action-card:hover {
  border-color: #00d4aa;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}

.card-name {
  font-size: 1rem;
  font-weight: 600;
  color: #ffffff;
}

.card-symbol {
  font-size: 0.82rem;
  color: #8899aa;
  margin-top: 2px;
}

.card-weight {
  font-size: 1.3rem;
  font-weight: 700;
  color: #00d4aa;
}

.card-details {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.85rem;
}

.card-detail-row {
  display: flex;
  justify-content: space-between;
}

.card-detail-label {
  color: #8899aa;
}

.card-action-buy {
  color: #00d4aa;
  font-weight: 600;
}

.card-action-hold {
  color: #ffa726;
  font-weight: 600;
}

.card-stoploss {
  color: #ff6b6b;
  font-size: 0.82rem;
}

/* ── Footer ── */
.footer {
  background: #16213e;
  border-radius: 10px;
  padding: 16px 24px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 0.85rem;
  color: #8899aa;
}

.footer-strategy {
  color: #e0e0e0;
  font-weight: 500;
}

.btn-refresh {
  background: rgba(0, 212, 170, 0.15);
  color: #00d4aa;
  border: 1px solid rgba(0, 212, 170, 0.3);
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  transition: background 0.2s;
}

.btn-refresh:hover {
  background: rgba(0, 212, 170, 0.25);
}

.btn-refresh:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ── Error ── */
.error-box {
  background: rgba(255, 107, 107, 0.1);
  border: 1px solid rgba(255, 107, 107, 0.3);
  border-radius: 10px;
  padding: 24px;
  text-align: center;
  color: #ff6b6b;
  margin-bottom: 20px;
  display: none;
}

/* ── Loading ── */
.loading-box {
  text-align: center;
  padding: 60px 20px;
  color: #8899aa;
  font-size: 1rem;
}

.loading-spinner {
  display: inline-block;
  width: 32px;
  height: 32px;
  border: 3px solid rgba(0, 212, 170, 0.2);
  border-top-color: #00d4aa;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive ── */
@media (max-width: 768px) {
  .status-bar {
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
  }
  .footer {
    flex-direction: column;
    text-align: center;
  }
  .cards-grid {
    grid-template-columns: 1fr;
  }
  thead th, tbody td {
    padding: 8px 8px;
    font-size: 0.82rem;
  }
  h1 { font-size: 1.2rem; }
}
</style>
</head>
<body>

<div class="container">
  <h1 id="pageTitle">行业轮动仪表盘</h1>

  <!-- Error -->
  <div class="error-box" id="errorBox">
    <div style="font-size:1.5rem; margin-bottom:8px;">&#9888;</div>
    <div id="errorMsg">数据加载失败</div>
  </div>

  <!-- Loading -->
  <div class="loading-box" id="loadingBox">
    <div class="loading-spinner"></div>
    <div>正在加载数据...</div>
  </div>

  <!-- Content (hidden until data loads) -->
  <div id="content" style="display:none;">

    <!-- 1. Status Bar -->
    <div class="status-bar" id="statusBar">
      <div class="status-item">
        <span class="status-label">信号日期</span>
        <span class="status-value" id="signalDate">—</span>
      </div>
      <div class="status-item">
        <span class="status-label">因子趋势</span>
        <span class="status-value" id="factorRegime">—</span>
      </div>
      <div class="status-item">
        <span class="status-label">仓位策略</span>
        <span class="status-value" id="positionRegime">—</span>
      </div>
      <div class="status-item">
        <span class="status-label">总敞口</span>
        <span class="status-value" id="totalExposure">—</span>
      </div>
      <div class="status-item">
        <span class="status-label">现金</span>
        <span class="status-value" id="cashWeight">—</span>
      </div>
    </div>

    <!-- 2. Signal Ranking Table -->
    <div class="panel">
      <div class="panel-title">信号排名表</div>
      <table>
        <thead>
          <tr>
            <th>排名</th>
            <th>代码</th>
            <th>名称</th>
            <th>主题</th>
            <th>动量Z</th>
            <th>相对强度</th>
            <th>量价</th>
            <th>评分</th>
            <th>目标仓位</th>
          </tr>
        </thead>
        <tbody id="signalTableBody">
        </tbody>
      </table>
    </div>

    <!-- 3. Portfolio Action Cards -->
    <div class="panel">
      <div class="panel-title">持仓操作卡</div>
      <div class="cards-grid" id="cardsGrid">
      </div>
      <div id="noCards" style="display:none; text-align:center; color:#8899aa; padding:20px;">
        当前无持仓信号
      </div>
    </div>

    <!-- 4. Footer -->
    <div class="footer">
      <div class="footer-strategy" id="strategyDesc">行业轮动策略</div>
      <div id="lastRefresh">最后刷新: —</div>
      <button class="btn-refresh" id="btnRefresh" onclick="loadData()">刷新数据</button>
    </div>

  </div>
</div>

<script>
function fmtPct(v) {
  if (v == null || isNaN(v)) return '—';
  return (v * 100).toFixed(1) + '%';
}

function fmtScore(v) {
  if (v == null || isNaN(v)) return '—';
  return v.toFixed(3);
}

function scoreClass(v) {
  if (v == null || isNaN(v)) return '';
  return v >= 0 ? 'score-pos' : 'score-neg';
}

function fmtTime() {
  var d = new Date();
  var hh = String(d.getHours()).padStart(2, '0');
  var mm = String(d.getMinutes()).padStart(2, '0');
  var ss = String(d.getSeconds()).padStart(2, '0');
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0') + ' ' +
    hh + ':' + mm + ':' + ss;
}

function renderStatusBar(data) {
  var ps = data.portfolio_state;

  document.getElementById('signalDate').textContent = data.signal_date;

  // Factor regime
  var frEl = document.getElementById('factorRegime');
  if (ps.factor_regime === 'bull') {
    frEl.innerHTML = '<span class="badge badge-green">🐂 牛市 (MA20&gt;MA60)</span>';
  } else {
    frEl.innerHTML = '<span class="badge badge-red">🐻 熊市 (MA20&lt;MA60)</span>';
  }

  // Position regime
  var prEl = document.getElementById('positionRegime');
  if (ps.position_regime === 'bull') {
    prEl.innerHTML = '<span class="badge badge-green">加仓 ×1.50</span>';
  } else {
    prEl.innerHTML = '<span class="badge badge-orange">减仓 ×0.50</span>';
  }

  document.getElementById('totalExposure').textContent = fmtPct(ps.total_exposure);
  document.getElementById('cashWeight').textContent = fmtPct(ps.cash_weight);
}

function renderTable(signals) {
  var tbody = document.getElementById('signalTableBody');
  tbody.innerHTML = '';

  signals.forEach(function(s) {
    var tr = document.createElement('tr');

    // Row class
    if (s.stop_loss_active || s.cooldown_until) {
      tr.className = 'row-stopped';
    } else if (s.selected) {
      tr.className = 'row-selected';
    }

    var statusSuffix = '';
    if (s.stop_loss_active) statusSuffix = ' [止损]';
    else if (s.cooldown_until) statusSuffix = ' [冷却]';

    tr.innerHTML =
      '<td>' + s.rank + '</td>' +
      '<td>' + escHtml(s.symbol) + '</td>' +
      '<td>' + escHtml(s.name) + statusSuffix + '</td>' +
      '<td>' + escHtml(s.theme) + '</td>' +
      '<td class="' + scoreClass(s.momentum_z) + '">' + fmtScore(s.momentum_z) + '</td>' +
      '<td>' + fmtPct(s.relative_strength_pct) + '</td>' +
      '<td class="' + scoreClass(s.volume_price_bonus) + '">' + fmtScore(s.volume_price_bonus) + '</td>' +
      '<td class="' + scoreClass(s.final_score) + '">' + fmtScore(s.final_score) + '</td>' +
      '<td>' + fmtPct(s.target_weight) + '</td>';

    tr.style.cursor = 'pointer';
    tr.addEventListener('click', (function(sig) {
      return function() { showEtfDetail(sig); };
    })(s));

    tbody.appendChild(tr);
  });
}

function renderCards(selected, config) {
  var grid = document.getElementById('cardsGrid');
  var noCards = document.getElementById('noCards');
  grid.innerHTML = '';

  if (!selected || selected.length === 0) {
    grid.style.display = 'none';
    noCards.style.display = 'block';
    return;
  }

  grid.style.display = '';
  noCards.style.display = 'none';

  var stopPct = config ? config.stop_loss_threshold : -0.05;

  selected.forEach(function(s) {
    var card = document.createElement('div');
    card.className = 'action-card';

    var action = '买入';
    var actionClass = 'card-action-buy';
    // Simple heuristic: if weight > 0, it's a buy/hold suggestion
    if (s.target_weight > 0) {
      action = '买入/持有';
      actionClass = 'card-action-hold';
    }

    card.innerHTML =
      '<div class="card-header">' +
        '<div>' +
          '<div class="card-name">' + escHtml(s.name) + '</div>' +
          '<div class="card-symbol">' + escHtml(s.symbol) + '</div>' +
        '</div>' +
        '<div class="card-weight">' + fmtPct(s.target_weight) + '</div>' +
      '</div>' +
      '<div class="card-details">' +
        '<div class="card-detail-row">' +
          '<span class="card-detail-label">操作建议</span>' +
          '<span class="' + actionClass + '">' + action + '</span>' +
        '</div>' +
        '<div class="card-detail-row">' +
          '<span class="card-detail-label">综合评分</span>' +
          '<span class="' + scoreClass(s.final_score) + '">' + fmtScore(s.final_score) + '</span>' +
        '</div>' +
        '<div class="card-detail-row">' +
          '<span class="card-detail-label">动量Z</span>' +
          '<span class="' + scoreClass(s.momentum_z) + '">' + fmtScore(s.momentum_z) + '</span>' +
        '</div>' +
        '<div class="card-detail-row">' +
          '<span class="card-detail-label">止损线</span>' +
          '<span class="card-stoploss">' + fmtPct(stopPct) + ' (入场价)</span>' +
        '</div>' +
      '</div>';

    grid.appendChild(card);
  });
}

function renderFooter(data) {
  var cfg = data.config;
  var ver = (cfg.version || '').toUpperCase();
  var desc = ver + ' 行业轮动策略 | K=' + cfg.k +
    ' | 止损' + (cfg.stop_loss_threshold * 100).toFixed(0) + '%';
  document.getElementById('strategyDesc').textContent = desc;
  document.getElementById('pageTitle').textContent = ver + ' 行业轮动仪表盘';
  document.title = ver + ' 行业轮动仪表盘';
  document.getElementById('lastRefresh').textContent = '最后刷新: ' + fmtTime();
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showError(msg) {
  document.getElementById('loadingBox').style.display = 'none';
  document.getElementById('content').style.display = 'none';
  var errBox = document.getElementById('errorBox');
  document.getElementById('errorMsg').textContent = msg || '数据加载失败';
  errBox.style.display = 'block';
}

function showContent() {
  document.getElementById('loadingBox').style.display = 'none';
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function loadData() {
  var btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.textContent = '加载中...';

  // Show loading on initial load, not on refresh
  if (document.getElementById('content').style.display === 'none') {
    document.getElementById('loadingBox').style.display = 'block';
  }
  document.getElementById('errorBox').style.display = 'none';

  fetch('/api/strategy/signal')
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    })
    .then(function(data) {
      renderStatusBar(data);
      renderTable(data.signals);
      renderCards(data.selected, data.config);
      renderFooter(data);
      showContent();
      loadBacktest((data.config && data.config.version) || 'v58');
    })
    .catch(function(err) {
      console.error('Failed to load signal data:', err);
      showError('数据加载失败: ' + err.message);
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '刷新数据';
    });
}

function loadBacktest(version) {
  Promise.all([
    fetch('/api/strategy/backtest/' + version).then(function(r){return r.json();}),
    fetch('/api/strategy/backtest/v48').then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(results) {
    var cur = results[0];
    var base = results[1];
    if (cur && !cur.error) renderEquityChart(cur, base);
    if (base && !base.error) renderStrategyComparison(cur, base);
  }).catch(function() {});
}

function renderStrategyComparison(cur, base) {
  var container = document.getElementById('compare-section');
  if (!container) {
    container = document.createElement('section');
    container.id = 'compare-section';
    container.style.cssText = 'background:#16213e;border-radius:12px;padding:20px;margin-top:20px;';
    document.querySelector('main').appendChild(container);
  }
  var curVer = cur.version || '当前策略';
  var baseVer = base.version || '基线策略';
  var sCur = cur.summary || {};
  var sBase = base.summary || {};
  var cCur = cur.checklist || {};
  var cBase = base.checklist || {};
  var pCur = Object.values(cCur).filter(function(v){return v;}).length;
  var pBase = Object.values(cBase).filter(function(v){return v;}).length;

  var rows = [
    ['年化收益', sCur.annualized_return, sBase.annualized_return, true],
    ['Sharpe', sCur.sharpe, sBase.sharpe, true],
    ['最大回撤', sCur.max_drawdown, sBase.max_drawdown, false],
    ['胜率', sCur.win_rate, sBase.win_rate, true],
    ['最差窗口', sCur.worst_window, sBase.worst_window, false],
    ['连续亏损', sCur.max_consecutive_losing_windows, sBase.max_consecutive_losing_windows, false],
  ];

  var html = '<h3 style="color:#e0e0e0;margin:0 0 12px 0;">⚖️ 策略对比: ' + curVer + '(进攻) vs ' + baseVer + '(稳健)</h3>';
  html += '<table style="width:100%;border-collapse:collapse;font-size:14px;">';
  html += '<tr style="border-bottom:1px solid #333;"><th style="text-align:left;padding:8px;color:#888;">指标</th>';
  html += '<th style="text-align:right;padding:8px;color:#ff6b6b;">' + curVer + ' 进攻 ('+pCur+'/8)</th>';
  html += '<th style="text-align:right;padding:8px;color:#00d4aa;">' + baseVer + ' 稳健 ('+pBase+'/8)</th></tr>';

  rows.forEach(function(r) {
    var valCur = r[1], valBase = r[2], higherBetter = r[3];
    var fmtCur = typeof valCur === 'number' ? (Math.abs(valCur) < 10 ? (valCur*100).toFixed(1)+'%' : valCur) : '-';
    var fmtBase = typeof valBase === 'number' ? (Math.abs(valBase) < 10 ? (valBase*100).toFixed(1)+'%' : valBase) : '-';
    if (r[0] === 'Sharpe') { fmtCur = (valCur||0).toFixed(3); fmtBase = (valBase||0).toFixed(3); }
    if (r[0] === '连续亏损') { fmtCur = valCur; fmtBase = valBase; }
    var betterCur = higherBetter ? valCur > valBase : valCur < valBase;
    var cCurColor = betterCur ? '#00d4aa' : '#e0e0e0';
    var cBaseColor = betterCur ? '#e0e0e0' : '#00d4aa';
    html += '<tr style="border-bottom:1px solid #222;">';
    html += '<td style="padding:8px;color:#ccc;">'+r[0]+'</td>';
    html += '<td style="text-align:right;padding:8px;color:'+cCurColor+';">'+fmtCur+'</td>';
    html += '<td style="text-align:right;padding:8px;color:'+cBaseColor+';">'+fmtBase+'</td></tr>';
  });
  html += '</table>';
  container.innerHTML = html;
}

function renderEquityChart(data, dataBase) {
  var container = document.getElementById('chart-section');
  if (!container) {
    container = document.createElement('section');
    container.id = 'chart-section';
    container.style.cssText = 'background:#16213e;border-radius:12px;padding:20px;margin-top:20px;';
    document.querySelector('main').appendChild(container);
  }

  var eq = data.equity_curve;
  if (!eq || eq.length === 0) return;

  var W = 800, H = 300, PAD = 50;
  var maxY = 0, minY = 999;
  eq.forEach(function(p) {
    var mx = Math.max(p.equity, p.benchmark);
    var mn = Math.min(p.equity, p.benchmark);
    if (mx > maxY) maxY = mx;
    if (mn < minY) minY = mn;
  });
  minY = Math.floor(minY * 20) / 20;
  maxY = Math.ceil(maxY * 20) / 20;
  if (maxY === minY) maxY = minY + 0.1;

  var summary = data.summary || {};
  var html = '<h3 style="color:#e0e0e0;margin:0 0 12px 0;">📈 历史净值曲线 (' + data.version + ')</h3>';
  html += '<div style="display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap;">';
  html += '<span style="color:#00d4aa">年化 ' + ((summary.annualized_return||0)*100).toFixed(1) + '%</span>';
  html += '<span style="color:#e0e0e0">Sharpe ' + (summary.sharpe||0).toFixed(3) + '</span>';
  html += '<span style="color:#ff6b6b">回撤 ' + ((summary.max_drawdown||0)*100).toFixed(1) + '%</span>';
  html += '<span style="color:#e0e0e0">胜率 ' + ((summary.win_rate||0)*100).toFixed(0) + '%</span>';
  html += '</div>';
  html += '<canvas id="equity-canvas" width="' + W + '" height="' + H + '" style="width:100%;max-width:' + W + 'px;height:auto;"></canvas>';
  html += '<div style="margin-top:8px;font-size:12px;color:#888;">';
  html += '<span style="color:#00d4aa">━━ ' + (data.version || '当前') + '策略</span> &nbsp; <span style="color:#7c4dff">╌╌ ' + ((dataBase && dataBase.version) || '基线') + '稳健</span> &nbsp; <span style="color:#ffa726">━━ 沪深300</span> &nbsp; ';
  html += '共 ' + eq.length + ' 个窗口 (' + eq[0].date + ' ~ ' + eq[eq.length-1].date + ')';
  html += '</div>';
  container.innerHTML = html;

  var canvas = document.getElementById('equity-canvas');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  ctx.fillStyle = '#0f1629';
  ctx.fillRect(0, 0, W, H);

  function xPos(i) { return PAD + (W - PAD * 2) * i / (eq.length - 1); }
  function yPos(v) { return H - PAD - (H - PAD * 2) * (v - minY) / (maxY - minY); }

  ctx.strokeStyle = '#333';
  ctx.lineWidth = 0.5;
  for (var g = 0; g <= 4; g++) {
    var gv = minY + (maxY - minY) * g / 4;
    var gy = yPos(gv);
    ctx.beginPath(); ctx.moveTo(PAD, gy); ctx.lineTo(W - PAD, gy); ctx.stroke();
    ctx.fillStyle = '#888'; ctx.font = '11px system-ui';
    ctx.fillText((gv * 100 - 100).toFixed(0) + '%', 5, gy + 4);
  }

  for (var li = 0; li < eq.length; li += Math.max(1, Math.floor(eq.length / 6))) {
    var lx = xPos(li);
    ctx.fillStyle = '#666'; ctx.font = '10px system-ui';
    ctx.save(); ctx.translate(lx, H - 5); ctx.rotate(-0.5);
    ctx.fillText(eq[li].date.substring(2, 7), 0, 0);
    ctx.restore();
  }

  function drawLine(key, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    eq.forEach(function(p, i) {
      var x = xPos(i), y = yPos(p[key]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  drawLine('benchmark', '#ffa726');
  drawLine('equity', '#00d4aa');

  // Overlay baseline strategy equity curve if available
  if (dataBase && dataBase.equity_curve && dataBase.equity_curve.length > 0) {
    var eqBase = dataBase.equity_curve;
    ctx.strokeStyle = '#7c4dff';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 3]);
    ctx.beginPath();
    eqBase.forEach(function(p, i) {
      if (i >= eq.length) return;
      var x = xPos(i), y = yPos(p.equity);
      if (y < PAD) y = PAD; if (y > H - PAD) y = H - PAD;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);
    var lastBase = eqBase[Math.min(eqBase.length - 1, eq.length - 1)];
    ctx.fillStyle = '#7c4dff'; ctx.font = '11px system-ui';
    ctx.fillText((dataBase.version || '基线') + ' ' + ((lastBase.equity - 1) * 100).toFixed(1) + '%', xPos(Math.min(eqBase.length - 1, eq.length - 1)) + 4, yPos(lastBase.equity) + 14);
  }

  var lastEq = eq[eq.length - 1];
  ctx.fillStyle = '#00d4aa'; ctx.font = 'bold 12px system-ui';
  ctx.fillText(((lastEq.equity - 1) * 100).toFixed(1) + '%', xPos(eq.length - 1) + 4, yPos(lastEq.equity));
  ctx.fillStyle = '#ffa726';
  ctx.fillText(((lastEq.benchmark - 1) * 100).toFixed(1) + '%', xPos(eq.length - 1) + 4, yPos(lastEq.benchmark));
}

// Initial load
loadData();

function showEtfDetail(sig) {
  var overlay = document.getElementById('etfModal');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'etfModal';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;';
    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.style.display = 'none'; });
    document.body.appendChild(overlay);
  }

  var scoreBar = function(label, val, max) {
    var pct = Math.min(100, Math.max(0, (val + max) / (2 * max) * 100));
    var color = val >= 0 ? '#00d4aa' : '#ff6b6b';
    return '<div style="margin:6px 0;"><span style="color:#aaa;font-size:13px;display:inline-block;width:80px;">' + label + '</span>' +
      '<span style="color:' + color + ';font-weight:bold;width:60px;display:inline-block;text-align:right;">' + (val >= 0 ? '+' : '') + val.toFixed(3) + '</span>' +
      '<div style="display:inline-block;width:calc(100% - 160px);height:8px;background:#1a1a2e;border-radius:4px;vertical-align:middle;margin-left:8px;">' +
      '<div style="width:' + pct + '%;height:100%;background:' + color + ';border-radius:4px;"></div></div></div>';
  };

  var selected = sig.selected ? '✅ 已选入持仓' : '未选入';
  var stopInfo = sig.stop_loss_active ? '⚠️ 止损已触发' : (sig.cooldown_until ? '⏸️ 冷却至 ' + sig.cooldown_until : '正常');

  var html = '<div style="background:#16213e;border-radius:16px;padding:24px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">';
  html += '<h3 style="color:#e0e0e0;margin:0;">' + escHtml(sig.name) + ' <span style="color:#888;font-size:14px;">' + escHtml(sig.symbol) + '</span></h3>';
  html += '<span style="cursor:pointer;color:#888;font-size:24px;" onclick="document.getElementById(\'etfModal\').style.display=\'none\'">✕</span></div>';

  html += '<div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;">';
  html += '<span style="background:#1a1a2e;padding:4px 10px;border-radius:6px;color:#ffa726;font-size:13px;">主题: ' + escHtml(sig.theme) + '</span>';
  html += '<span style="background:#1a1a2e;padding:4px 10px;border-radius:6px;color:' + (sig.selected ? '#00d4aa' : '#888') + ';font-size:13px;">' + selected + '</span>';
  html += '<span style="background:#1a1a2e;padding:4px 10px;border-radius:6px;color:#e0e0e0;font-size:13px;">排名: #' + sig.rank + '</span>';
  html += '</div>';

  html += '<div style="background:#1a1a2e;border-radius:10px;padding:16px;margin-bottom:12px;">';
  html += '<div style="color:#888;font-size:12px;margin-bottom:8px;">因子分解</div>';
  html += scoreBar('动量Z', sig.momentum_z, 2);
  html += scoreBar('相对强度', sig.relative_strength_pct - 0.5, 0.5);
  html += scoreBar('量价确认', sig.volume_price_bonus, 0.3);
  html += scoreBar('综合评分', sig.final_score, 2);
  html += '</div>';

  html += '<div style="background:#1a1a2e;border-radius:10px;padding:16px;">';
  html += '<div style="color:#888;font-size:12px;margin-bottom:8px;">持仓状态</div>';
  html += '<div style="display:flex;justify-content:space-between;margin:4px 0;"><span style="color:#aaa;">目标仓位</span><span style="color:#e0e0e0;font-weight:bold;">' + fmtPct(sig.target_weight) + '</span></div>';
  html += '<div style="display:flex;justify-content:space-between;margin:4px 0;"><span style="color:#aaa;">止损线</span><span style="color:#e0e0e0;">入场价 × 0.95</span></div>';
  html += '<div style="display:flex;justify-content:space-between;margin:4px 0;"><span style="color:#aaa;">状态</span><span style="color:#e0e0e0;">' + stopInfo + '</span></div>';
  html += '</div>';

  html += '</div>';
  overlay.innerHTML = html;
  overlay.style.display = 'flex';
}
