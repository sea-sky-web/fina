[project]
name = "fina-backend"
version = "0.1.0"
description = "Backend ETF rotation radar for China-listed ETFs."
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.15.0",
  "duckdb>=1.0.0",
  "fastapi>=0.115.0",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "pydantic-settings>=2.4.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
